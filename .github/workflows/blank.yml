name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "**/*.swift"
      - "project.yml"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen and ldid
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project NetworkConditioner.xcodeproj \
            -scheme NetworkConditioner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Self-sign with ldid (app + extension)
        run: |
          APP="build/Build/Products/Release-iphoneos/NetworkConditioner.app"

          ldid -S"NetworkConditionerApp/NetworkConditionerApp.entitlements" \
            "$APP/NetworkConditioner"

          ldid -S"ConditionerExtension/ConditionerExtension.entitlements" \
            "$APP/PlugIns/ConditionerExtension.appex/ConditionerExtension"

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/NetworkConditioner.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r NetworkConditioner.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkConditioner-ipa
          path: NetworkConditioner.ipa
          retention-days: 14
